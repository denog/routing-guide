# Base config for the DUT (VyOS set commands). The snippet from the guide is
# applied on top of it.
set interfaces ethernet eth1 address 198.51.100.0/31
set interfaces ethernet eth1 address 2001:db8::2/64
set interfaces ethernet eth2 address 198.51.100.2/31
set interfaces ethernet eth2 address 2001:db8:1::2/64

set protocols bgp system-as 64500
set protocols bgp parameters router-id 198.51.100.0
set protocols bgp neighbor 198.51.100.1 remote-as 64496
set protocols bgp neighbor 198.51.100.1 address-family ipv4-unicast
set protocols bgp neighbor 2001:db8::1 remote-as 64496
set protocols bgp neighbor 2001:db8::1 address-family ipv6-unicast
set protocols bgp neighbor 198.51.100.3 remote-as 64511
set protocols bgp neighbor 198.51.100.3 address-family ipv4-unicast
set protocols bgp neighbor 2001:db8:1::3 remote-as 64511
set protocols bgp neighbor 2001:db8:1::3 address-family ipv6-unicast
