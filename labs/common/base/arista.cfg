! Base config for the DUT. The snippet from the guide is applied on top of it.
service routing protocols model multi-agent
!
hostname dut
!
interface Ethernet1
   no switchport
   ip address 198.51.100.0/31
   ipv6 address 2001:db8::2/64
!
interface Ethernet2
   no switchport
   ip address 198.51.100.2/31
   ipv6 address 2001:db8:1::2/64
!
ip routing
ipv6 unicast-routing
!
router bgp 64500
   router-id 198.51.100.0
   no bgp default ipv4-unicast
   neighbor 198.51.100.1 remote-as 64496
   neighbor 2001:db8::1 remote-as 64496
   neighbor 198.51.100.3 remote-as 64511
   neighbor 2001:db8:1::3 remote-as 64511
   neighbor 198.51.100.3 send-community standard extended large
   neighbor 2001:db8:1::3 send-community standard extended large
   !
   address-family ipv4
      neighbor 198.51.100.1 activate
      neighbor 198.51.100.3 activate
   !
   address-family ipv6
      neighbor 2001:db8::1 activate
      neighbor 2001:db8:1::3 activate
!
end
