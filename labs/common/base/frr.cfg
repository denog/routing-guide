# Base config for an FRR DUT, applied with vtysh. The snippet from the guide
# is applied on top of it.
router bgp 64500
 bgp router-id 198.51.100.0
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 198.51.100.1 remote-as 64496
 neighbor 2001:db8::1 remote-as 64496
 neighbor 198.51.100.3 remote-as 64511
 neighbor 2001:db8:1::3 remote-as 64511
 address-family ipv4 unicast
  neighbor 198.51.100.1 activate
  neighbor 198.51.100.3 activate
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8::1 activate
  neighbor 2001:db8:1::3 activate
 exit-address-family
