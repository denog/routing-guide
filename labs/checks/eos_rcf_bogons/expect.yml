# Check: the Arista EOS RCF example on bogon_prefixes as it was before it
# was fixed (literal copies, the guide page now has the fixed version).
# Case 1: original example. Result: all routes are rejected, also routes
#         that are no bogons, because example_in() had no final "return true;".
# Case 2: only "return true;" added. Shows the copy-paste error: bogon_v6()
#         matched prefix_list_v4 BOGONS_v4, so IPv6 bogons were accepted.
# Case 3: both fixed, identical to the example now on the guide page.
# Cases 1 and 2 are expected to FAIL, case 3 to PASS.
#   IPv4 bogons: 10.0.0.0/8, 192.168.1.0/24 (entries with "le 32")
#   IPv6 bogons: fc00::/7, 2002::/16 (exact entries of BOGONS_v6)
#   no bogons:   1.0.0.0/24, 2a00::/12
page: docs/guides/route_filtering/inbound/bogon_prefixes.md
tab: Arista EOS RCF
cases:
  - name: original example (copy-paste error, no final return true)
    snippet: |
      ip prefix-list BOGONS_v4
          seq 1 permit 0.0.0.0/8 le 32
          seq 2 permit 10.0.0.0/8 le 32
          seq 3 permit 100.64.0.0/10 le 32
          seq 4 permit 127.0.0.0/8 le 32
          seq 5 permit 169.254.0.0/16 le 32
          seq 6 permit 172.16.0.0/12 le 32
          seq 7 permit 192.0.2.0/24 le 32
          seq 8 permit 192.88.99.0/24 le 32
          seq 9 permit 192.168.0.0/16 le 32
          seq 10 permit 198.18.0.0/15 le 32
          seq 11 permit 198.51.100.0/24 le 32
          seq 12 permit 203.0.113.0/24 le 32
          seq 13 permit 224.0.0.0/4 le 32
          seq 14 permit 240.0.0.0/4 le 32
      !
      ipv6 prefix-list BOGONS_v6
          seq 1 permit 100::/64
          seq 2 permit 2001:2::/48
          seq 3 permit 2001:10::/28
          seq 4 permit 2001:db8::/32
          seq 5 permit 2002::/16
          seq 6 permit 3ffe::/16
          seq 7 permit fc00::/7
          seq 8 permit fe80::/10
          seq 9 permit fec0::/10
          seq 10 permit ff00::/8
          seq 11 permit 3fff::/20
          seq 12 permit 5f00::/16
      !
      router general
      control-functions
          code unit example
      function bogon_v4() {
          return prefix match prefix_list_v4 BOGONS_v4;
      }
      function bogon_v6() {
          return prefix match prefix_list_v4 BOGONS_v4;
      }
      function example_in() {
          if bogon_v4() {
              exit false;
          } else if bogon_v6() {
              exit false;
          }
      }
      EOF
            compile
            commit
            exit
          exit
      !
      router bgp 64500
          address-family ipv6
            neighbor 2001:db8::1 rcf in example_in()
          address-family ipv4
            neighbor 198.51.100.1 rcf in example_in()
    accept: [1.0.0.0/24, "2a00::/12"]
    reject: [10.0.0.0/8, 192.168.1.0/24, "fc00::/7", "2002::/16"]
  - name: final return true added, copy-paste error kept
    snippet: |
      ip prefix-list BOGONS_v4
          seq 1 permit 0.0.0.0/8 le 32
          seq 2 permit 10.0.0.0/8 le 32
          seq 3 permit 100.64.0.0/10 le 32
          seq 4 permit 127.0.0.0/8 le 32
          seq 5 permit 169.254.0.0/16 le 32
          seq 6 permit 172.16.0.0/12 le 32
          seq 7 permit 192.0.2.0/24 le 32
          seq 8 permit 192.88.99.0/24 le 32
          seq 9 permit 192.168.0.0/16 le 32
          seq 10 permit 198.18.0.0/15 le 32
          seq 11 permit 198.51.100.0/24 le 32
          seq 12 permit 203.0.113.0/24 le 32
          seq 13 permit 224.0.0.0/4 le 32
          seq 14 permit 240.0.0.0/4 le 32
      !
      ipv6 prefix-list BOGONS_v6
          seq 1 permit 100::/64
          seq 2 permit 2001:2::/48
          seq 3 permit 2001:10::/28
          seq 4 permit 2001:db8::/32
          seq 5 permit 2002::/16
          seq 6 permit 3ffe::/16
          seq 7 permit fc00::/7
          seq 8 permit fe80::/10
          seq 9 permit fec0::/10
          seq 10 permit ff00::/8
          seq 11 permit 3fff::/20
          seq 12 permit 5f00::/16
      !
      router general
      control-functions
          code unit example
      function bogon_v4() {
          return prefix match prefix_list_v4 BOGONS_v4;
      }
      function bogon_v6() {
          return prefix match prefix_list_v4 BOGONS_v4;
      }
      function example_in() {
          if bogon_v4() {
              exit false;
          } else if bogon_v6() {
              exit false;
          }
          return true;
      }
      EOF
            compile
            commit
            exit
          exit
      !
      router bgp 64500
          address-family ipv6
            neighbor 2001:db8::1 rcf in example_in()
          address-family ipv4
            neighbor 198.51.100.1 rcf in example_in()
    accept: [1.0.0.0/24, "2a00::/12"]
    reject: [10.0.0.0/8, 192.168.1.0/24, "fc00::/7", "2002::/16"]
