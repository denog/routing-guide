frr defaults traditional
hostname collector
!
route-map PATH-LEAK permit 10
 set as-path prepend 64496
!
route-map PATH-OTHER permit 10
 set as-path prepend 64510
!
router bgp 64511
 bgp router-id 198.51.100.3
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 neighbor 198.51.100.2 remote-as 64500
 neighbor 2001:db8:1::2 remote-as 64500
 address-family ipv4 unicast
  neighbor 198.51.100.2 activate
  network 192.0.2.0/24 route-map PATH-LEAK
  network 198.51.100.128/25 route-map PATH-OTHER
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8:1::2 activate
  network 3fff:100::/32 route-map PATH-LEAK
 exit-address-family
!
