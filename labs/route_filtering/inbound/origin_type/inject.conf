frr defaults traditional
hostname inject
!
route-map ORIGIN-INCOMPLETE permit 10
 set origin incomplete
!
route-map ORIGIN-EGP permit 10
 set origin egp
!
router bgp 64496
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 neighbor 198.51.100.0 remote-as 64500
 neighbor 2001:db8::2 remote-as 64500
 address-family ipv4 unicast
  neighbor 198.51.100.0 activate
  network 203.0.113.0/24 route-map ORIGIN-INCOMPLETE
  network 192.0.2.0/24
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8::2 activate
  network 3fff::/20 route-map ORIGIN-EGP
 exit-address-family
!
