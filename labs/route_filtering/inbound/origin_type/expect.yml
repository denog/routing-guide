page: docs/guides/route_filtering/inbound/origin_type.md
cases:
  - name: reset origin to IGP
    accept: [203.0.113.0/24, 192.0.2.0/24, "3fff::/20"]
    attributes:
      - {prefix: 203.0.113.0/24, field: origin, control: incomplete, test: IGP}
      - {prefix: "3fff::/20", field: origin, control: EGP, test: IGP}
      - {prefix: 192.0.2.0/24, field: origin, control: IGP, test: IGP}
