frr defaults traditional
hostname inject
!
route-map OWN-STD permit 10
 set community 64500:100 64496:1
!
route-map OWN-LARGE permit 10
 set large-community 64500:0:100 64496:0:1
!
route-map OWN-STD-V6 permit 10
 set community 64500:200
!
route-map FOREIGN permit 10
 set community 64496:2
 set large-community 64496:0:2
!
router bgp 64496
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 neighbor 198.51.100.0 remote-as 64500
 neighbor 2001:db8::2 remote-as 64500
 address-family ipv4 unicast
  neighbor 198.51.100.0 activate
  network 203.0.113.0/24 route-map OWN-STD
  network 192.0.2.0/24 route-map OWN-LARGE
  network 198.51.100.128/25 route-map FOREIGN
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8::2 activate
  network 3fff::/20 route-map OWN-STD-V6
  network 3fff:100::/32 route-map FOREIGN
 exit-address-family
!
