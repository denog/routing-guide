page: docs/guides/route_filtering/inbound/own_bgp_communities.md
cases:
  - name: drop routes carrying own communities
    blocks: [0, 1, 3]
    context:
      arista: route-map peer-in permit 1000
    accept: [198.51.100.128/25, "3fff:100::/32"]
    reject: [203.0.113.0/24, 192.0.2.0/24, "3fff::/20"]
  - name: delete own communities and accept the routes
    blocks: [0, 2, 3]
    accept: [203.0.113.0/24, 192.0.2.0/24, 198.51.100.128/25, "3fff::/20", "3fff:100::/32"]
    attributes:
      - {prefix: 203.0.113.0/24, field: communities, control: ["64496:1", "64500:100"], test: ["64496:1"]}
      - {prefix: 192.0.2.0/24, field: large_communities, control: ["64496:0:1", "64500:0:100"], test: ["64496:0:1"]}
      - {prefix: "3fff::/20", field: communities, control: ["64500:200"], test: []}
      - {prefix: 198.51.100.128/25, field: communities, control: ["64496:2"], test: ["64496:2"]}
      - {prefix: 198.51.100.128/25, field: large_communities, control: ["64496:0:2"], test: ["64496:0:2"]}
