frr defaults traditional
hostname inject
!
route-map PATH-T1-MIDDLE permit 10
 set as-path prepend 1299 64497
!
route-map PATH-T1-ORIGIN permit 10
 set as-path prepend 64497 3356
!
route-map PATH-CLEAN permit 10
 set as-path prepend 64497 64498
!
route-map PATH-SIMILAR permit 10
 set as-path prepend 17400 11740
!
route-map PATH-T1-V6 permit 10
 set as-path prepend 7018 64497
!
router bgp 64496
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 neighbor 198.51.100.0 remote-as 64500
 neighbor 2001:db8::2 remote-as 64500
 address-family ipv4 unicast
  neighbor 198.51.100.0 activate
  network 203.0.113.0/24 route-map PATH-T1-MIDDLE
  network 203.0.113.128/25 route-map PATH-T1-ORIGIN
  network 192.0.2.0/24 route-map PATH-CLEAN
  network 198.51.100.128/25 route-map PATH-SIMILAR
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8::2 activate
  network 3fff::/20 route-map PATH-T1-V6
  network 3fff:100::/32 route-map PATH-CLEAN
 exit-address-family
!
