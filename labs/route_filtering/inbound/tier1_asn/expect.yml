page: docs/guides/route_filtering/inbound/tier1_asn.md
cases:
  - name: reject paths containing a Tier 1 ASN
    context:
      arista: route-map peer-in permit 1000
    accept: [192.0.2.0/24, 198.51.100.128/25, "3fff:100::/32"]
    reject: [203.0.113.0/24, 203.0.113.128/25, "3fff::/20"]
    attributes:
      # guards against false positives: 17400 and 11740 contain "174"
      - {prefix: 198.51.100.128/25, field: as_path, test: "64500 64496 17400 11740"}
