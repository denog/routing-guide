frr defaults traditional
hostname inject
!
route-map PATH-VALID permit 10
 set as-path prepend 64497
!
route-map PATH-LEAK permit 10
 set as-path prepend 64497 64498
!
route-map PATH-UNKNOWN permit 10
 set as-path prepend 64510
!
router bgp 64496
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 neighbor 198.51.100.0 remote-as 64500
 neighbor 2001:db8::2 remote-as 64500
 address-family ipv4 unicast
  neighbor 198.51.100.0 activate
  network 203.0.113.0/24 route-map PATH-VALID
  network 192.0.2.0/24 route-map PATH-LEAK
  network 198.51.100.128/25 route-map PATH-UNKNOWN
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8::2 activate
  network 3fff:100::/32 route-map PATH-VALID
  network 3fff::/20 route-map PATH-LEAK
 exit-address-family
!
